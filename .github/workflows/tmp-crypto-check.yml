name: tmp crypto check
on:
  push:
    branches: [claude/compassionate-faraday-7z8cfd]
    paths: [".github/workflows/tmp-crypto-check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          node --input-type=module -e '
          const { spark, quoteSummary } = await import("./netlify/lib/yahoo.mjs");
          const syms = "BTC-USD ETH-USD BNB-USD SOL-USD XRP-USD DOGE-USD ADA-USD TRX-USD AVAX-USD LINK-USD DOT-USD TON11419-USD SHIB-USD LTC-USD BCH-USD XLM-USD UNI7083-USD ATOM-USD XMR-USD ETC-USD HBAR-USD FIL-USD APT21794-USD NEAR-USD ICP-USD VET-USD ALGO-USD AAVE-USD SUI20947-USD ARB11841-USD OP-USD MKR-USD INJ-USD GRT6719-USD STX4847-USD SAND-USD MANA-USD AXS-USD XTZ-USD EOS-USD THETA-USD PEPE24478-USD HYPE32196-USD KAS-USD CRO-USD RNDR-USD RENDER-USD TAO22974-USD ONDO-USD SEI-USD JUP29210-USD WLD-USD ENA-USD BONK-USD FET-USD QNT-USD EGLD-USD FLOW-USD CHZ-USD NEO-USD ZEC-USD DASH-USD IOTA-USD KCS-USD LEO-USD OKB-USD GT-USD CAKE-USD LDO-USD CRV-USD SNX-USD COMP5692-USD RUNE-USD IMX10603-USD".split(" ");
          for (let i = 0; i < syms.length; i += 20) {
            const b = syms.slice(i, i + 20);
            try {
              const d = await spark(b, "5y", "1wk");
              for (const s of b) {
                const e = d[s];
                const n = e ? e.close.filter((c) => c != null).length : 0;
                console.log("SPARK", s, n, e ? e.fulldayPrice : "MISSING");
              }
            } catch (err) { console.log("BATCHERR", b.join(","), err.message); }
          }
          for (const s of ["BTC-USD", "ETH-USD", "SOL-USD"]) {
            try {
              const r = await quoteSummary(s, ["assetProfile", "summaryProfile", "price"]);
              console.log("QS", s, JSON.stringify({ name: r.price?.longName || r.price?.shortName, keys: Object.keys(r), sp: (r.summaryProfile?.description || "").slice(0, 140), ap: (r.assetProfile?.description || r.assetProfile?.longBusinessSummary || "").slice(0, 80) }));
            } catch (err) { console.log("QSERR", s, err.message); }
          }'
