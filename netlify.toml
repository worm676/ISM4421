[build]
  publish = "public"
  functions = "netlify/functions"
  command = "echo 'No build step required'"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/lib/**"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
